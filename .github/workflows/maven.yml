# 最小 CI：把「160 个单元测试全靠人工跑 mvn test」变成推送即验。
# 覆盖评审 R1（零自动化验证 + 无 CI）的自动化缺口；不覆盖需要真实
# MySQL/Redis/Nacos/Kafka/ES 的集成层（见 docs/architecture/migration-roadmap.md 的 S0-b）。
name: Maven CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # 允许在 Actions 页面手动触发，便于验证流水线本身
  workflow_dispatch:

jobs:
  test:
    name: 编译并运行单元测试
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # distribution 用 zulu：与 6 个服务 Dockerfile 的运行时 azul/zulu-openjdk:25 保持同一厂商，
      # 避免「CI 编译用的 JDK 和线上跑的 JDK 不是同一个家族」。
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      # 与本地验证过的命令保持一致（reactor 根目录跑全部 8 个模块的 test 阶段）。
      # 用 -B -ntp 而不是 -q：失败时要能看到是哪个模块、哪条断言红了。
      - name: Run unit tests
        run: mvn -B -ntp test

      # 打包检查：覆盖可装配产物（6 个服务的 spring-boot 可执行 jar repackage）。
      # 上一步已跑过 test，这里 -DskipTests 只验装配能否产出 jar，不重复跑测试。
      - name: Package assemblies
        run: mvn -B -ntp package -DskipTests
