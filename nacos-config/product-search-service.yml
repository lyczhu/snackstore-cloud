# 商品搜索服务配置
server:
  port: 8085

spring:
  application:
    name: product-search-service
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: product-search-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.lawyus.snackstore.common.message
        spring.json.value.default.type: com.lawyus.snackstore.common.message.ProductSearchSyncMessage
        isolation.level: read_committed
      max-poll-records: 100
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      ack-mode: MANUAL_IMMEDIATE
    topic:
      product-changed: product-changed

logging:
  level:
    com.lawyus.snackstore.product.search: info
    org.springframework.kafka: info
    co.elastic.clients: warn

product-search:
  rebuild:
    cron: 0 0 3 * * *
    page-size: 100
