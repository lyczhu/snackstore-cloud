# 商品搜索服务配置
server:
  port: 8085

spring:
  application:
    name: product-search-service
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}
    username: ${ES_USERNAME:}
    password: ${ES_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: product-search-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.lawyus.snackstore.common.message
        spring.json.value.default.type: com.lawyus.snackstore.common.message.ProductSearchSyncMessage
        isolation.level: read_committed
      max-poll-records: 100
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      ack-mode: MANUAL_IMMEDIATE
    topic:
      product-changed: product-changed

logging:
  level:
    # 搜索入参日志（ProductSearchServiceImpl 的 “ES搜索请求: keyword=…”）位于 DEBUG，
    # 因此本行设为 info 时不会输出——这是有意选择：同一请求已由 info 级的
    # “ES搜索完成: keyword/命中数/耗时”占位，重复打参数只会放大热点读路径的日志量。
    # 排查参数绑定/过滤条件问题时把下面一行改为 debug 即可，Nacos 实时刷新无需重启；
    # 注意整包调成 debug 会连带打开 ProductSearchIndexServiceImpl 每条消息的索引 debug 日志。
    com.lawyus.snackstore.product.search: info
    org.springframework.kafka: info
    co.elastic.clients: warn

product-search:
  rebuild:
    cron: 0 0 3 * * *
    page-size: 100
