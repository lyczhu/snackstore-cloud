server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**,/api/auth/**,/api/admin/**
          filters:
            - StripPrefix=1
          order: 0
        - id: product-search-service
          uri: lb://product-search-service
          predicates:
            - Path=/api/product-search/**
          filters:
            - StripPrefix=1
          order: 0
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
          filters:
            - StripPrefix=1
          order: 1
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1
          order: 2
        - id: statistics-service
          uri: lb://statistics-service
          predicates:
            - Path=/api/statistics/**
          filters:
            - StripPrefix=1
          order: 3
        # OpenAPI 聚合路由（供网关 Swagger UI 拉取各服务 api-docs，同源免跨域）
        - id: openapi-user-service
          uri: lb://user-service
          predicates:
            - Path=/api-docs/user-service/**
          filters:
            - StripPrefix=2
        - id: openapi-product-service
          uri: lb://product-service
          predicates:
            - Path=/api-docs/product-service/**
          filters:
            - StripPrefix=2
        - id: openapi-product-search-service
          uri: lb://product-search-service
          predicates:
            - Path=/api-docs/product-search-service/**
          filters:
            - StripPrefix=2
        - id: openapi-order-service
          uri: lb://order-service
          predicates:
            - Path=/api-docs/order-service/**
          filters:
            - StripPrefix=2
        - id: openapi-statistics-service
          uri: lb://statistics-service
          predicates:
            - Path=/api-docs/statistics-service/**
          filters:
            - StripPrefix=2
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_NAMESPACE:public}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-flow-rules
            rule-type: gw-flow
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
        degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_NAMESPACE:public}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-degrade-rules
            rule-type: degrade
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
    data:
      redis:
        host: ${REDIS_HOST:127.0.0.1}
        port: ${REDIS_PORT:6379}
        password: ${REDIS_PASSWORD:}
        timeout: 3000ms

gateway:
  security:
    whitelist:
      - "POST:/api/auth/sms-code"
      - "POST:/api/auth/register"
      - "POST:/api/auth/login"
      - "POST:/api/auth/admin/login"
      - "GET:/api/products/**"
      - "GET:/api/products/categories/**"
      - "GET:/api-docs/**"
    admin-prefix-patterns:
      - "/api/admin/**"
      - "/api/auth/admin/**"
    admin-only-patterns:
      - "POST:/api/products"
      - "PUT:/api/products/*"
      - "DELETE:/api/products/*"
      - "PATCH:/api/products/*/status"
      - "POST:/api/products/*/stock/deductions"
      - "POST:/api/products/*/stock/rollbacks"
      - "POST:/api/products/stock/batch-deductions"
      - "POST:/api/products/stock/batch-rollbacks"
      - "GET:/api/statistics/**"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /api-docs/user-service/v3/api-docs
      - name: product-service
        url: /api-docs/product-service/v3/api-docs
      - name: product-search-service
        url: /api-docs/product-search-service/v3/api-docs
      - name: order-service
        url: /api-docs/order-service/v3/api-docs
      - name: statistics-service
        url: /api-docs/statistics-service/v3/api-docs

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.lawyus.snackstore: debug
    org.springframework.cloud.gateway: info

management:
  endpoints:
    web:
      exposure:
        include: health,info
