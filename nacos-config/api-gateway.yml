server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              # 关闭 discovery locator：所有业务路由已由 Nacos 显式定义，
              # 避免 /{serviceId}/** 自动路由暴露 /internal/** 内部接口（默认即为 false，此处显式声明）
              enabled: false
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_NAMESPACE:public}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-flow-rules
            rule-type: gw-flow
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
        degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_NAMESPACE:public}
            group-id: SENTINEL_GROUP
            data-id: ${spring.application.name}-degrade-rules
            rule-type: degrade
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD:nacos}
    data:
      redis:
        host: ${REDIS_HOST:127.0.0.1}
        port: ${REDIS_PORT:6379}
        password: ${REDIS_PASSWORD:}
        timeout: 3000ms

gateway:
  security:
    whitelist:
      - "POST:/api/auth/sms-code"
      - "POST:/api/auth/register"
      - "POST:/api/auth/login"
      - "POST:/api/auth/admin/login"
      - "GET:/api/products/**"
      - "GET:/api/products/categories/**"
      # 仅放行 OpenAPI 文档路径（* 不跨段）；历史上 /** 配合开放代理路由可匿名伪造
      # X-User-* 头越权访问业务接口，已收紧
      - "GET:/api-docs/*/v3/api-docs"
    admin-prefix-patterns:
      - "/api/admin/**"
      - "/api/auth/admin/**"
    admin-only-patterns:
      - "POST:/api/products"
      - "PUT:/api/products/*"
      - "DELETE:/api/products/*"
      - "PATCH:/api/products/*/status"
      - "POST:/api/products/*/stock/deductions"
      - "POST:/api/products/*/stock/rollbacks"
      - "POST:/api/products/stock/batch-deductions"
      - "POST:/api/products/stock/batch-rollbacks"
      - "POST:/api/products/categories"
      - "PUT:/api/products/categories/**"
      - "DELETE:/api/products/categories/**"
      - "GET:/api/statistics/**"
      - "POST:/api/product-search/rebuild"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /api-docs/user-service/v3/api-docs
      - name: product-service
        url: /api-docs/product-service/v3/api-docs
      - name: product-search-service
        url: /api-docs/product-search-service/v3/api-docs
      - name: order-service
        url: /api-docs/order-service/v3/api-docs
      - name: statistics-service
        url: /api-docs/statistics-service/v3/api-docs

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.lawyus.snackstore: debug
    org.springframework.cloud.gateway: info

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,gateway
  endpoint:
    gateway:
      access: read-only
