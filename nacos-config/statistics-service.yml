server:
  port: 8087

spring:
  application:
    name: statistics-service
  cloud:
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      eager: true
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 10000
      httpclient:
        hc5:
          enabled: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 3
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

logging:
  level:
    com.lawyus.snackstore: info
