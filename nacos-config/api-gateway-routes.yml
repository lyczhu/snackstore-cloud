# 网关动态路由定义（方案 A）
#
# 本文件由 NacosRouteDefinitionRepository 直接从 Nacos 读取并监听变更，
# 不再经 spring.config.import 绑定到 spring.cloud.gateway.routes，
# 因此修改本配置后网关会实时刷新路由，无需重启。
#
# 说明：
# - predicates/filters 使用网关 shortcut 文本格式（Name=arg1,arg2）。
# - order 缺省为 0。路由顺序约束必须保持：
#   /api/product-search/**（order 0）先于 /api/products/**（order 1）。
# - 本文件不要再添加 spring.cloud.gateway 前缀的配置；
#   discovery locator 的关闭已移至 api-gateway.yml。
routes:
  - id: user-service
    uri: lb://user-service
    predicates:
      - Path=/api/users/**,/api/auth/**,/api/admin/**
    filters:
      - StripPrefix=1
    order: 0
  - id: product-search-service
    uri: lb://product-search-service
    predicates:
      - Path=/api/product-search/**
    filters:
      - StripPrefix=1
    order: 0
  - id: product-service
    uri: lb://product-service
    predicates:
      - Path=/api/products/**
    filters:
      - StripPrefix=1
    order: 1
  - id: order-service
    uri: lb://order-service
    predicates:
      - Path=/api/orders/**
    filters:
      - StripPrefix=1
    order: 2
  - id: statistics-service
    uri: lb://statistics-service
    predicates:
      - Path=/api/statistics/**
    filters:
      - StripPrefix=1
    order: 3
  # OpenAPI 聚合路由（供网关 Swagger UI 拉取各服务 api-docs，同源免跨域）
  # 谓词只放行 /v3/api-docs 精确路径：历史上 /** + StripPrefix=2 会把该路由变成
  # 指向各服务根路径的开放代理，可匿名/越权访问业务接口与 /internal/**（越权高危）。
  - id: openapi-user-service
    uri: lb://user-service
    predicates:
      - Path=/api-docs/user-service/v3/api-docs
    filters:
      - StripPrefix=2
  - id: openapi-product-service
    uri: lb://product-service
    predicates:
      - Path=/api-docs/product-service/v3/api-docs
    filters:
      - StripPrefix=2
  - id: openapi-product-search-service
    uri: lb://product-search-service
    predicates:
      - Path=/api-docs/product-search-service/v3/api-docs
    filters:
      - StripPrefix=2
  - id: openapi-order-service
    uri: lb://order-service
    predicates:
      - Path=/api-docs/order-service/v3/api-docs
    filters:
      - StripPrefix=2
  - id: openapi-statistics-service
    uri: lb://statistics-service
    predicates:
      - Path=/api-docs/statistics-service/v3/api-docs
    filters:
      - StripPrefix=2
